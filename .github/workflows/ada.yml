name: Ada (GNAT)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  
jobs:
  build-representation:
    runs-on: ubuntu-latest

    # Every object representation skit can be built with (ADR 0001,
    # option D; the Object_Representation variable in alire.toml).
    strategy:
      fail-fast: false
      matrix:
        representation: [ Tagged_32, NaN_Boxed_64 ]

    name: build (${{ matrix.representation }})

    steps:
    - name: Checkout
      uses: actions/checkout@v3
        
    - name: Set up alire
      uses: alire-project/setup-alire@v2
      with:
        version: 2.1.0
        toolchain: gnat_native^15 gprbuild

    - name: Choose the object representation
      working-directory: skit_tests
      run: |
        printf '\n[configuration.values]\nskit.Object_Representation = "%s"\n' \
          "${{ matrix.representation }}" >> alire.toml

    - name: Build Skit_Tests
      run: cd skit_tests; alr build
      
    - name: Run tests
      run: cd skit_tests; alr run

  # Branch protection requires a check named "build". The matrix jobs above
  # report as "build (<representation>)", so this job reports "build" once
  # all of them have finished. It runs even when one fails, and fails
  # itself unless every one succeeded: a skipped job would count as
  # passing.
  build:
    needs: build-representation
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check every representation passed
      run: test "${{ needs.build-representation.result }}" = success
